name: GitHub 商业机会手机PDF
on:
  push:
    branches: [main]
    paths:
      - 'github-trending/archive/*.md'
      - '.github/workflows/github-top10-pdf.yml'
      - '.github/scripts/*.py'
      - '.github/tests/*.py'
  workflow_dispatch:
    inputs:
      report_date:
        description: '归档日期 YYYY-MM-DD；留空使用最新的日期归档'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: github-top10-pdf-main
  cancel-in-progress: false
jobs:
  mobile-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued runs must include PDFs already committed by earlier runs.
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CJK font and PDF engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
          python -m pip install --no-cache-dir 'fpdf2==2.8.4' 'fonttools>=4.53,<5'
      - name: Test report date selection and PDF header
        run: python -m unittest discover -s .github/tests -v
      - name: Build PDF from dated archive
        env:
          REQUESTED_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          # latest.md is published separately and may still describe yesterday.
          DAY="$(python .github/scripts/select_github_trending_report.py "$REQUESTED_REPORT_DATE")"
          python .github/scripts/build_github_trending_pdf.py "github-trending/archive/$DAY.md" "github-trending/pdf/$DAY.pdf"
          echo "REPORT_DAY=$DAY" >> "$GITHUB_ENV"
      - name: Commit only the generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "github-trending/pdf/$REPORT_DAY.pdf"
          if ! git diff --cached --quiet; then
            git commit -m "Archive mobile PDF for $REPORT_DAY"
            # Daily JSON and project catalog may be committed while this PDF job runs.
            # Rebase the PDF-only commit on the current main without overwriting other files.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent main update detected; retrying ($attempt/4)"
              sleep 2
            done
            echo "PDF archive push failed after four retries" >&2
            exit 1
          else
            echo "Already present, no changes"
          fi

