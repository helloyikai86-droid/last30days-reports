name: Public GitHub project catalog sync
on:
  push:
    branches: [main]
    paths:
      - 'docs/daily/*.json'
permissions:
  contents: write
concurrency:
  group: public-project-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge daily public data without erasing existing analysis
        run: python .github/scripts/sync_github_opportunity_projects.py
      - name: Commit synced public catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/projects.json docs/daily/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Safely merge public GitHub opportunity catalog"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
