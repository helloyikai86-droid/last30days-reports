name: Merge public GitHub Top10 into long-term project library
on:
  push:
    branches: [main]
    paths:
      - 'docs/daily/20??-??-??.json'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Date YYYY-MM-DD; empty means latest'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: github-projects-sync-main
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge only public information; preserve full history and private isolation
        env:
          REQUESTED_DATE: ${{ inputs.report_date }}
        run: |
          python .github/scripts/sync_github_opportunity_projects.py "$REQUESTED_DATE"
      - name: Commit public project catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/projects.json docs/daily
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Merge current GitHub Top10 into public long-term catalog"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
