<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>项目详细分析</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#15171c;--muted:#667085;--line:#e5e8ee;--shadow:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:860px;margin:auto;padding:18px 14px 70px}.back{display:inline-block;margin-bottom:14px;color:#374151;text-decoration:none}.hero,.section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:12px}.hero h1{margin:0 0 8px;font-size:28px}.meta{font-size:13px;color:#475467;margin:5px 0}.desc{font-size:16px;line-height:1.8;color:#344054}.section h2{margin:0 0 10px;font-size:18px}.section div{white-space:pre-wrap;font-size:15px;line-height:1.85;color:#344054}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-flex;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:#111827;background:#fff}.btn.primary{background:#111827;color:#fff;border-color:#111827}.hidden{display:none}@media(max-width:700px){.wrap{padding:12px 12px 64px}.hero,.section{padding:16px}.hero h1{font-size:24px}}
</style></head><body><main class="wrap">
<a id="backCatalog" class="back" href="./">← 返回项目目录</a>
<section class="hero"><h1 id="name">加载中…</h1><div id="meta" class="meta"></div><div id="starState" class="meta hidden" style="font-weight:700;color:#b45309">★ 你已 Star 这个项目</div><div id="desc" class="desc"></div><div class="actions" style="margin-top:14px"><a id="notes" class="btn primary">打开笔记</a><a id="github" class="btn" target="_blank">GitHub</a></div></section>
<div id="sections"></div>
</main><script src="./config.js"></script><script>
const qs=new URLSearchParams(location.search),id=qs.get("id"),date=qs.get("date");
const NOTES_API=(window.NOTES_API||"").replace(/\/$/,""),KEY_STORE="github-opportunity-notes-key";
function repoFullName(url){const m=String(url||"").match(/^https:\/\/github\.com\/([^/?#]+)\/([^/?#]+?)(?:\.git)?(?:[/?#]|$)/i);return m?(m[1]+"/"+m[2]).toLowerCase():"";}
async function showStarState(url){
  const key=localStorage.getItem(KEY_STORE)||sessionStorage.getItem(KEY_STORE)||"";
  if(!key||!NOTES_API)return;
  try{
    const r=await fetch(NOTES_API+"/starred",{headers:{"X-Notes-Key":key}});
    if(r.status===401){localStorage.removeItem(KEY_STORE);sessionStorage.removeItem(KEY_STORE);return;}
    if(!r.ok)return;
    const out=await r.json(),set=new Set((out.starred||[]).map(x=>String(x).toLowerCase()));
    document.getElementById("starState").classList.toggle("hidden",!set.has(repoFullName(url)));
  }catch{}
}
function catalogReturnUrl(){
  try{
    const state=JSON.parse(sessionStorage.getItem("github-catalog-state-v2")||"null");
    const url=new URL(state?.url||"./",location.href);
    return url.origin===location.origin?url.href:new URL("./",location.href).href;
  }catch{return new URL("./",location.href).href;}
}
const backCatalog=document.getElementById("backCatalog"),catalogUrl=catalogReturnUrl();
backCatalog.href=catalogUrl;
backCatalog.onclick=e=>{
  e.preventDefault();
  try{
    const ref=new URL(document.referrer);
    const cameFromCatalog=ref.origin===location.origin&&(ref.pathname.endsWith("/")||ref.pathname.endsWith("/index.html"));
    if(cameFromCatalog&&history.length>1){history.back();return;}
  }catch{}
  // 如果详情页来自笔记页或被直接打开，明确回目录，避免详情与笔记互相后退。
  location.replace(catalogUrl);
};
const defs=[
["一句话看懂","overview"],["项目具体做什么","what_it_is"],["目标用户","target_users"],["核心问题与旧方案","problem"],["过去通常怎么解决","past_solution"],["核心机制 / 工作流程","how_it_works"],["技术架构 / 关键实现","architecture"],["为什么近期爆火","why_hot"],["核心差异化","difference"],["商业化路径","business"],["中国市场机会","china_opportunity"],["给没有背景的读者","beginner_guide"],["具体使用场景（谁在什么情况下怎么用）","usage_scenarios"],["可借鉴的产品场景","use_cases"],["风险与限制","risks"],["对我的启发","inspiration"],["明确判断","judgment"],["完整深度分析","full_analysis"]
];
const canonicalAnalysisKeys=new Set(defs.map(([,key])=>key).concat(["description"]));
function section(title,text){if(!text)return"";return '<section class="section"><h2>'+title+'</h2><div>'+String(text).replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</div></section>';}
Promise.all([fetch("./projects.json?v="+Date.now()).then(r=>r.json()),date?fetch("./daily/"+date+".json?v="+Date.now()).then(r=>r.json()).catch(()=>null):Promise.resolve(null)]).then(([p,d])=>{
  const base=(p.projects||[]).find(x=>x.id===id)||{};
  const day=d?(d.projects||[]).find(x=>x.id===id):null;
  const x={...base};
  if(day){
    for(const [k,v] of Object.entries(day)){
      // 分析资料以长期项目库为唯一版本；日榜只覆盖当天排名、Star、语言等快照字段。
      if(canonicalAnalysisKeys.has(k)&&base[k])continue;
      const placeholder=typeof v==="string"&&(v.startsWith("该项目曾出现在")||v.startsWith("历史日报恢复：")||v.startsWith("历史日报恢复记录："));
      const empty=v===null||v===undefined||v===""||placeholder||(Array.isArray(v)&&v.length===0);
      if(!empty)x[k]=v;
    }
  }
  document.title=x.name+"｜详细分析";document.getElementById("name").textContent=(x.rank?"#"+x.rank+" ":"")+x.name;
  const bits=[];if(date)bits.push(date);if(x.stars_today)bits.push(x.stars_today);if(x.total_stars)bits.push("总 Star "+x.total_stars);if(x.language)bits.push(x.language);document.getElementById("meta").textContent=bits.join(" ｜ ");
  document.getElementById("desc").textContent=x.description||"";
  document.getElementById("github").href=x.url||"#";document.getElementById("notes").href="./notes.html?id="+encodeURIComponent(id);showStarState(x.url);
  let html="";
  const fallback={overview:x.description,problem:x.problem,why_hot:x.why_hot||x.why,difference:x.difference,business:x.business,judgment:x.judgment};
  for(const [t,k] of defs)html+=section(t,x[k]||fallback[k]);
  if(!html)html=section("项目说明",x.description||"暂无详细分析。");
  document.getElementById("sections").innerHTML=html;
  restoreDetailPosition();
}).catch(()=>{document.getElementById("name").textContent="项目加载失败";});
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href*="notes.html"]');
  if(!a)return;
  sessionStorage.setItem("notes-return-url",location.href);
  sessionStorage.setItem("notes-return-scroll",String(window.scrollY));
});
function restoreDetailPosition(){
  const y=sessionStorage.getItem("notes-return-scroll");
  if(y===null)return;
  sessionStorage.removeItem("notes-return-scroll");
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,Number(y)||0)));
}
</script></body></html>
