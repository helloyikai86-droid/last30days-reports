<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f6f7fb"/>
<title>GitHub 机会目录</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e6e9ef;--blue:#2563eb;--blueSoft:#eaf2ff;--shadow:0 6px 22px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1020px;margin:auto;padding:16px 14px 80px}.hero h1{margin:2px 0 6px;font-size:28px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.toolbar{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.94);backdrop-filter:blur(14px);padding:12px 0}
.row{display:grid;grid-template-columns:1fr 180px;gap:10px}.search,.date{height:46px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 14px;font-size:15px;box-shadow:var(--shadow);outline:none}
.chips{display:flex;gap:8px;overflow:auto;padding-top:10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:13px;color:#4b5563}.chip.active{background:#111827;color:#fff;border-color:#111827}
.meta{display:flex;justify-content:space-between;margin:13px 2px 10px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column}.top{display:flex;gap:10px;align-items:flex-start}.name{font-weight:760;font-size:18px;line-height:1.3;flex:1}.follow{border:0;background:var(--blueSoft);color:var(--blue);border-radius:10px;padding:7px 10px;font-size:12px}.follow.on{background:#111827;color:#fff}
.daily{font-size:12px;color:#374151;margin:6px 0 0;font-weight:650}.desc{font-size:14px;line-height:1.65;color:#374151;margin:9px 0 12px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#f1f3f6;color:#596273}.tag.hot{background:#fff0f0;color:#b42318}
.actions{display:flex;gap:8px;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;color:#111827;border-radius:10px;padding:9px 11px;font-size:13px;text-decoration:none;cursor:pointer}.btn.primary{background:#111827;color:#fff;border-color:#111827}
.empty{text-align:center;color:var(--muted);padding:46px}
dialog{border:0;border-radius:20px;padding:0;width:min(760px,calc(100% - 24px));max-height:88vh;box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(15,23,42,.5);backdrop-filter:blur(2px)}
.modal{padding:22px;overflow:auto;max-height:88vh}.modal h2{margin:0 0 7px;font-size:25px}.summary{color:#374151;font-size:14px;line-height:1.7}.kv{background:#f7f8fa;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:10px 0}.kv b{display:block;margin-bottom:5px}
.modalActions{display:flex;gap:8px;position:sticky;bottom:-22px;background:linear-gradient(transparent,#fff 26%);padding:22px 0 2px}.modalActions .btn{flex:1;text-align:center}
.note{background:#fff8e6;border:1px solid #f3e3b5;border-radius:13px;padding:10px 12px;font-size:13px;color:#6b5a20;margin:10px 0}.footer{margin-top:30px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
@media(max-width:700px){.wrap{padding:12px 12px 72px}.hero h1{font-size:24px}.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.date{width:100%}.modal{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>GitHub 机会目录</h1>
    <p>可以按日期回看当天 Top 10，也可以看长期项目库。点“详细分析”会显示当天完整分析，不再只有两句摘要。</p>
  </div>
  <div class="toolbar">
    <div class="row">
      <input id="search" class="search" placeholder="搜索项目、关键词，例如：浏览器 / Agent / 配音"/>
      <select id="dateSelect" class="date"><option value="all">全部历史项目</option></select>
    </div>
    <div id="chips" class="chips"></div>
  </div>
  <div id="dayNote" class="note" hidden></div>
  <div class="meta"><span id="count">加载中…</span><span id="modeLabel">全部历史项目</span></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>没有符合条件的项目。</div>
  <div class="footer">“关注”只保存在当前浏览器。历史日报数据和项目目录由每日任务持续更新。</div>
</div>

<dialog id="dialog">
  <div class="modal">
    <h2 id="mName"></h2>
    <div id="mDaily" class="daily"></div>
    <p id="mDesc" class="summary"></p>
    <div class="kv"><b>目标用户</b><span id="mUsers"></span></div>
    <div class="kv"><b>它解决什么问题</b><span id="mProblem"></span></div>
    <div class="kv"><b>为什么近期增长</b><span id="mHot"></span></div>
    <div class="kv"><b>核心差异化</b><span id="mDiff"></span></div>
    <div class="kv"><b>商业机会 / 中国市场</b><span id="mBiz"></span></div>
    <div class="kv"><b>明确判断</b><span id="mJudge"></span></div>
    <div class="modalActions">
      <a id="mGitHub" class="btn primary" target="_blank" rel="noopener">打开 GitHub</a>
      <button class="btn" onclick="document.getElementById('dialog').close()">关闭</button>
    </div>
  </div>
</dialog>

<script>
let master=[],shown=[],category="全部";
const favKey="github-opportunity-favorites-v1";
const favorites=new Set(JSON.parse(localStorage.getItem(favKey)||"[]"));
const categories=["全部","我关注","AI/Agent","企业AI","AIGC","增长/内容","开发工具","基础设施"];
const chips=document.getElementById("chips");
categories.forEach((c,i)=>{
  const b=document.createElement("button");b.className="chip"+(i===0?" active":"");b.textContent=c;
  b.onclick=()=>{category=c;[...chips.children].forEach(x=>x.classList.toggle("active",x===b));render();};
  chips.appendChild(b);
});
function saveFav(){localStorage.setItem(favKey,JSON.stringify([...favorites]));}
function val(v){return v||"—";}
function openDetail(p){
  document.getElementById("mName").textContent=(p.rank?("#"+p.rank+" "):"")+p.name;
  document.getElementById("mDaily").textContent=p.stars_today?`${p.stars_today}｜总 Star ${p.total_stars||"—"}｜${p.language||"—"}`:"";
  document.getElementById("mDesc").textContent=val(p.description);
  document.getElementById("mUsers").textContent=val(p.target_users);
  document.getElementById("mProblem").textContent=val(p.problem);
  document.getElementById("mHot").textContent=val(p.why_hot||p.why);
  document.getElementById("mDiff").textContent=val(p.difference);
  document.getElementById("mBiz").textContent=val(p.business);
  document.getElementById("mJudge").textContent=val(p.judgment);
  document.getElementById("mGitHub").href=p.url;
  document.getElementById("dialog").showModal();
}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const list=shown.filter(p=>{
    const hay=[p.name,p.description,(p.tags||[]).join(" "),p.target_users,p.problem,p.why_hot,p.why,p.difference,p.business,p.judgment].join(" ").toLowerCase();
    return (!q||hay.includes(q))&&(category==="全部"||(category==="我关注"?favorites.has(p.id):(p.tags||[]).includes(category)));
  });
  document.getElementById("count").textContent=`${list.length} 个项目`;
  const grid=document.getElementById("grid");grid.innerHTML="";document.getElementById("empty").hidden=list.length>0;
  list.forEach(p=>{
    const el=document.createElement("article");el.className="card";
    const isFav=favorites.has(p.id);
    const tags=(p.tags||[]).map(t=>`<span class="tag ${t==="重点"?"hot":""}">${t}</span>`).join("");
    const daily=p.stars_today?`<div class="daily">#${p.rank}　${p.stars_today}　总 Star ${p.total_stars||"—"}　${p.language||""}</div>`:"";
    el.innerHTML=`<div class="top"><div class="name">${p.name}</div><button class="follow ${isFav?"on":""}">${isFav?"已关注":"关注"}</button></div>${daily}<div class="desc">${p.description||""}</div><div class="tags">${tags}</div><div class="actions"><button class="btn detail">详细分析</button><a class="btn" href="${p.url}" target="_blank" rel="noopener">GitHub</a></div>`;
    el.querySelector(".follow").onclick=()=>{favorites.has(p.id)?favorites.delete(p.id):favorites.add(p.id);saveFav();render();};
    el.querySelector(".detail").onclick=()=>openDetail(p);grid.appendChild(el);
  });
}
async function loadAll(){
  shown=master;document.getElementById("modeLabel").textContent="全部历史项目";
  document.getElementById("dayNote").hidden=true;render();
}
async function loadDate(date){
  const data=await fetch("./daily/"+date+".json?v="+Date.now()).then(r=>r.json());
  const tagsById=Object.fromEntries(master.map(p=>[p.id,p.tags||[]]));
  shown=(data.projects||[]).map(p=>({...p,tags:tagsById[p.id]||[]}));
  document.getElementById("modeLabel").textContent=data.date+" 当日 Top 10";
  const n=document.getElementById("dayNote");n.textContent=data.note||"";n.hidden=!data.note;render();
}
document.getElementById("search").addEventListener("input",render);
document.getElementById("dateSelect").addEventListener("change",e=>e.target.value==="all"?loadAll():loadDate(e.target.value));
Promise.all([
  fetch("./projects.json?v="+Date.now()).then(r=>r.json()),
  fetch("./daily/index.json?v="+Date.now()).then(r=>r.json())
]).then(([pData,dData])=>{
  master=pData.projects||[];shown=master;
  const sel=document.getElementById("dateSelect");
  (dData.dates||[]).forEach(d=>{const o=document.createElement("option");o.value=d.date;o.textContent=d.label||d.date;sel.appendChild(o);});
  render();
}).catch(()=>{document.getElementById("count").textContent="加载失败";document.getElementById("empty").hidden=false;});
</script>
</body>
</html>
