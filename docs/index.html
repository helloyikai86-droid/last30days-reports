<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GitHub 机会目录</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#15171c;--muted:#687080;--line:#e5e8ee;--blue:#2563eb;--blueSoft:#eaf2ff;--green:#087f5b;--greenSoft:#e9fbf4;--shadow:0 7px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1060px;margin:auto;padding:18px 14px 80px}.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(246,247,251,.94);backdrop-filter:blur(14px);padding:12px 0}
.filters{display:grid;grid-template-columns:1fr 180px 180px;gap:10px}.control{height:46px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 13px;font-size:14px;box-shadow:var(--shadow);outline:none}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 1px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;color:#4b5563;cursor:pointer}.chip.active{background:#111827;color:#fff;border-color:#111827}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 2px 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;min-height:190px}.card:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(15,23,42,.09)}
.name{font-size:18px;font-weight:760;line-height:1.3}.daily{font-size:12px;font-weight:650;color:#374151;margin-top:7px}.desc{font-size:14px;line-height:1.65;color:#374151;margin:10px 0 12px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#f1f3f6;color:#596273}.tag.hot{background:#fff0f0;color:#b42318}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:#111827;border-radius:10px;padding:9px 11px;font-size:13px;text-decoration:none;cursor:pointer}.btn.detail{background:#111827;color:#fff;border-color:#111827}.btn.notes.has{background:var(--greenSoft);color:var(--green);border-color:#b7ead7;font-weight:700}.empty{text-align:center;color:var(--muted);padding:46px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
@media(max-width:760px){.wrap{padding:12px 12px 70px}.hero h1{font-size:24px}.filters{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>GitHub 机会目录</h1>
    <p>以后这里作为主要阅读入口：项目卡片看摘要，详细分析与个人笔记分开；支持按日期、时间范围、评分和分类筛选。</p>
  </header>
  <div class="toolbar">
    <div class="filters">
      <input id="search" class="control" placeholder="搜索项目、关键词，例如：Agent / 配音 / 浏览器">
      <select id="dateSelect" class="control"><option value="all">全部历史项目</option></select>
      <select id="timeSelect" class="control">
        <option value="all">全部时间</option><option value="3">近3天</option><option value="7">近7天</option><option value="15">近15天</option><option value="30">近1个月</option>
      </select>
    </div>
    <div class="filters" style="margin-top:10px;grid-template-columns:1fr 180px 180px">
      <div></div>
      <select id="ratingSelect" class="control">
        <option value="all">全部评分</option><option value="5">★★★★★ 5分</option><option value="4">★★★★☆ 4分</option><option value="3">★★★☆☆ 3分</option><option value="2">★★☆☆☆ 2分</option><option value="1">★☆☆☆☆ 1分</option><option value="unrated">未评分</option>
      </select>
      <select id="statusSelect" class="control">
        <option value="all">全部状态</option><option value="👀 观察">👀 观察</option><option value="💡 有启发">💡 有启发</option><option value="🧪 想验证">🧪 想验证</option><option value="🚀 准备做">🚀 准备做</option><option value="✅ 已研究">✅ 已研究</option><option value="⏸ 暂缓">⏸ 暂缓</option>
      </select>
    </div>
    <div id="chips" class="chips"></div>
  </div>
  <div class="meta"><span id="count">加载中…</span><span id="modeLabel">全部历史项目</span></div>
  <div id="grid" class="grid"></div><div id="empty" class="empty" hidden>没有符合条件的项目。</div>
  <div class="footer">点击卡片空白区域直接进入详细分析；按钮区域保持各自功能。</div>
</div>
<script src="./config.js"></script>
<script>
let master=[],shown=[],dates=[],category="全部",ratingFilter="all",statusFilter="all",timeFilter="all",selectedDate="all";
const NOTES_API=(window.NOTES_API||"").replace(/\/$/,"");
let notesKey=sessionStorage.getItem("github-opportunity-notes-key")||"";
const recentSets={};

const categories=["全部","有笔记","AI/Agent","企业AI","AIGC","增长/内容","开发工具","基础设施"];
const chips=document.getElementById("chips");
categories.forEach((c,i)=>{const b=document.createElement("button");b.className="chip"+(i===0?" active":"");b.textContent=c;b.onclick=()=>{category=c;[...chips.children].forEach(x=>x.classList.toggle("active",x===b));render();};chips.appendChild(b);});

function detailUrl(p){return "./detail.html?id="+encodeURIComponent(p.id)+(selectedDate!=="all"?"&date="+selectedDate:"");}
function noteUrl(p){return "./notes.html?id="+encodeURIComponent(p.id);}
function daysAgo(dateStr){const d=new Date(dateStr+"T00:00:00");const n=new Date();n.setHours(0,0,0,0);return Math.floor((n-d)/86400000);}
async function buildRecentSets(){
  for(const n of [3,7,15,30]) recentSets[n]=new Set();
  const usable=dates.filter(d=>daysAgo(d.date)>=0&&daysAgo(d.date)<30);
  await Promise.all(usable.map(async d=>{
    try{
      const data=await fetch("./daily/"+d.date+".json?v="+Date.now()).then(r=>r.json());
      for(const p of (data.projects||[])){
        const age=daysAgo(d.date);
        for(const n of [3,7,15,30]) if(age<n) recentSets[n].add(p.id);
      }
    }catch(e){}
  }));
}
async function syncSummary(){
  if(!NOTES_API)return;
  try{
    let r=await fetch(NOTES_API+"/summary");
    let out;
    if(r.ok) out=await r.json();
    else if(notesKey){
      r=await fetch(NOTES_API+"/notes",{headers:{"X-Notes-Key":notesKey}});
      if(r.ok) out=await r.json();
    }
    const by=(out&&out.notes)||{};
    for(const p of master){const n=by[p.notes_issue];if(n)Object.assign(p,{rating:n.rating,status:n.status,has_notes:n.has_notes});}
    render();
  }catch(e){}
}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const list=shown.filter(p=>{
    const hay=[p.name,p.description,(p.tags||[]).join(" "),p.target_users,p.problem,p.why_hot,p.why,p.difference,p.business,p.judgment,p.full_analysis].join(" ").toLowerCase();
    const cat=category==="全部"||(category==="有笔记"?!!p.has_notes:(p.tags||[]).includes(category));
    const rate=ratingFilter==="all"||(ratingFilter==="unrated"?!p.rating:String(p.rating)===ratingFilter);
    const stat=statusFilter==="all"||p.status===statusFilter;
    const time=timeFilter==="all"||recentSets[timeFilter]?.has(p.id);
    return (!q||hay.includes(q))&&cat&&rate&&stat&&time;
  });
  document.getElementById("count").textContent=list.length+" 个项目";
  document.getElementById("empty").hidden=list.length>0;
  const grid=document.getElementById("grid");grid.innerHTML="";
  for(const p of list){
    const el=document.createElement("article");el.className="card";
    const tags=(p.tags||[]).map(t=>'<span class="tag '+(t==="重点"?"hot":"")+'">'+t+'</span>').join("");
    const rank=p.rank?"#"+p.rank+"　":"";
    const daily=p.stars_today?'<div class="daily">'+rank+p.stars_today+'　总 Star '+(p.total_stars||"—")+'　'+(p.language||"")+'</div>':"";
    const rating=p.rating?'<span class="tag hot">我的评分 '+"★".repeat(p.rating)+"☆".repeat(5-p.rating)+'</span>':"";
    const note=p.has_notes?'<span class="tag">已做笔记</span>':"";
    el.innerHTML='<div class="name">'+p.name+'</div>'+daily+'<div class="desc">'+(p.description||"")+'</div><div class="tags">'+rating+note+tags+'</div><div class="actions"><a class="btn detail" href="'+detailUrl(p)+'">详细分析</a><a class="btn notes '+(p.has_notes?"has":"")+'" href="'+noteUrl(p)+'">'+(p.has_notes?"笔记 ✓":"笔记")+'</a><a class="btn" href="'+p.url+'" target="_blank" rel="noopener">GitHub</a></div>';
    el.onclick=e=>{if(e.target.closest("a,button,input,select,textarea"))return;location.href=detailUrl(p);};
    grid.appendChild(el);
  }
}
async function loadDate(date){
  selectedDate=date;timeFilter="all";document.getElementById("timeSelect").value="all";
  if(date==="all"){shown=master;document.getElementById("modeLabel").textContent="全部历史项目";render();return;}
  const data=await fetch("./daily/"+date+".json?v="+Date.now()).then(r=>r.json());
  const by=Object.fromEntries(master.map(p=>[p.id,p]));
  shown=(data.projects||[]).map(p=>({...p,tags:by[p.id]?.tags||[],notes_issue:by[p.id]?.notes_issue,has_notes:by[p.id]?.has_notes||false,rating:by[p.id]?.rating||null,status:by[p.id]?.status||"👀 观察"}));
  document.getElementById("modeLabel").textContent=date+" 当日 Top 10";render();
}
document.getElementById("search").oninput=render;
document.getElementById("ratingSelect").onchange=e=>{ratingFilter=e.target.value;render();};
document.getElementById("statusSelect").onchange=e=>{statusFilter=e.target.value;render();};
document.getElementById("dateSelect").onchange=e=>loadDate(e.target.value);
document.getElementById("timeSelect").onchange=e=>{timeFilter=e.target.value;selectedDate="all";document.getElementById("dateSelect").value="all";shown=master;document.getElementById("modeLabel").textContent=timeFilter==="all"?"全部历史项目":"近"+timeFilter+(timeFilter==="30"?"天（约1个月）":"天");render();};

Promise.all([fetch("./projects.json?v="+Date.now()).then(r=>r.json()),fetch("./daily/index.json?v="+Date.now()).then(r=>r.json())]).then(async([p,d])=>{
  master=p.projects||[];shown=master;dates=d.dates||[];
  const sel=document.getElementById("dateSelect");dates.forEach(x=>{const o=document.createElement("option");o.value=x.date;o.textContent=x.label||x.date;sel.appendChild(o);});
  await buildRecentSets();render();syncSummary();
}).catch(()=>{document.getElementById("count").textContent="加载失败";});
</script>
</body></html>
