<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GitHub 机会目录</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#15171c;--muted:#687080;--line:#e5e8ee;--green:#087f5b;--greenSoft:#e9fbf4;--shadow:0 7px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1060px;margin:auto;padding:18px 14px 86px}.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
.filtersArea{padding:12px 0}.filters{display:grid;grid-template-columns:1fr 180px 180px;gap:10px}.control{height:46px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 13px;font-size:14px;box-shadow:var(--shadow);outline:none}.resetBtn{height:46px}
.stickyBar{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.96);backdrop-filter:blur(14px);padding:8px 0 9px;border-bottom:1px solid rgba(229,232,238,.9)}
.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;color:#4b5563;cursor:pointer}.chip.active{background:#111827;color:#fff;border-color:#111827}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 2px 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.daySep{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:12px 2px 2px;color:#344054;font-weight:760;font-size:15px}.daySep:after{content:"";height:1px;background:#dfe3ea;flex:1}.daySep small{font-weight:500;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;min-height:190px}.card:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(15,23,42,.09)}
.name{font-size:18px;font-weight:760;line-height:1.3}.daily{font-size:12px;font-weight:650;color:#374151;margin-top:7px}.desc{font-size:14px;line-height:1.65;color:#374151;margin:10px 0 12px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#f1f3f6;color:#596273}.tag.hot{background:#fff0f0;color:#b42318}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:#111827;border-radius:10px;padding:9px 11px;font-size:13px;text-decoration:none;cursor:pointer}.btn.detail{background:#111827;color:#fff;border-color:#111827}.btn.notes.has{background:var(--greenSoft);color:var(--green);border-color:#b7ead7;font-weight:700}.empty{text-align:center;color:var(--muted);padding:46px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
#toTop{position:fixed;right:18px;bottom:24px;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:#111827;color:#fff;box-shadow:0 8px 24px rgba(15,23,42,.22);cursor:pointer;display:none;z-index:30;font-size:20px}
@media(max-width:760px){.wrap{padding:12px 12px 76px}.hero h1{font-size:24px}.filters{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:auto}.filtersArea{padding-bottom:6px}.stickyBar{margin:0 -12px;padding:8px 12px 9px}.daySep{margin-top:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>GitHub 机会目录</h1>
    <p>默认按最近一次上榜时间从近到远；同一天按 Star 增量从高到低。公开访客只看项目分析；评分、状态和笔记只有输入 NOTES_KEY 后才加载。</p>
  </header>

  <div class="filtersArea">
    <div class="filters">
      <input id="search" class="control" placeholder="搜索项目、关键词，例如：Agent / 配音 / 浏览器">
      <input id="datePicker" type="date" class="control" title="选择某一天">
      <select id="timeSelect" class="control">
        <option value="all">全部时间</option><option value="3">近3天</option><option value="7">近7天</option><option value="15">近15天</option><option value="30">近1个月</option>
      </select>
    </div>
    <div class="filters" style="margin-top:10px">
      <select id="ratingSelect" class="control" style="display:none">
        <option value="all">全部评分</option><option value="rated">已评分</option><option value="5">★★★★★ 5分</option><option value="4">★★★★☆ 4分</option><option value="3">★★★☆☆ 3分</option><option value="2">★★☆☆☆ 2分</option><option value="1">★☆☆☆☆ 1分</option><option value="unrated">未评分</option>
      </select>
      <select id="statusSelect" class="control" style="display:none">
        <option value="all">全部状态</option><option value="👀 观察">👀 观察</option><option value="💡 有启发">💡 有启发</option><option value="🧪 想验证">🧪 想验证</option><option value="🚀 准备做">🚀 准备做</option><option value="✅ 已研究">✅ 已研究</option><option value="⏸ 暂缓">⏸ 暂缓</option>
      </select>
      <select id="sortSelect" class="control">
        <option value="recent">最近上榜（默认）</option><option value="stars">Star 增速</option><option value="rating">我的评分</option><option value="first">首次发现</option>
      </select>
    </div>
  </div>

  <div class="stickyBar"><div id="chips" class="chips"></div><button id="unlockBtn" class="chip" style="margin-top:8px">🔒 解锁我的数据</button></div>
  <div class="meta"><span id="count">加载中…</span><span id="modeLabel">全部历史项目</span></div>
  <div id="grid" class="grid"></div><div id="empty" class="empty" hidden>没有符合条件的项目。</div>
  <div class="footer">点击卡片非按钮区域，直接进入详细分析；“笔记”有内容时会高亮。</div>
</div>
<button id="toTop" aria-label="回到顶部">↑</button>

<script src="./config.js"></script>
<script>
let master=[],shown=[],dates=[],category="全部",ratingFilter="all",statusFilter="all",timeFilter="all",selectedDate="",sortMode="recent";
const NOTES_API=(window.NOTES_API||"").replace(/\/$/,"");
const appearance={}, firstSeen={}, lastSeen={}, latestDaily={}, dateSet=new Set();
let privateUnlocked=false, privateNotes={},pendingRestore=null;
const CATALOG_STATE_KEY="github-catalog-state-v2";
function saveCatalogState(){
  const state={
    url:location.href,scrollY:window.scrollY,category,ratingFilter,statusFilter,timeFilter,selectedDate,sortMode,
    search:document.getElementById("search")?.value||"",ts:Date.now()
  };
  sessionStorage.setItem(CATALOG_STATE_KEY,JSON.stringify(state));
}
function readCatalogState(){
  try{
    const x=JSON.parse(sessionStorage.getItem(CATALOG_STATE_KEY)||"null");
    return x&&Date.now()-x.ts<86400000?x:null;
  }catch{return null;}
}
function restoreCatalogControls(st){
  if(!st)return;
  category=st.category||"全部";ratingFilter=st.ratingFilter||"all";statusFilter=st.statusFilter||"all";
  timeFilter=st.timeFilter||"all";selectedDate=st.selectedDate||"";sortMode=st.sortMode||"recent";
  document.getElementById("search").value=st.search||"";
  document.getElementById("ratingSelect").value=ratingFilter;
  document.getElementById("statusSelect").value=statusFilter;
  document.getElementById("timeSelect").value=timeFilter;
  document.getElementById("sortSelect").value=sortMode;
  document.getElementById("datePicker").value=selectedDate;
}
function restoreCatalogScroll(st){
  if(!st)return;
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo(0,Number(st.scrollY)||0)));
}

const categories=["全部","AI/Agent","企业AI","AIGC","增长/内容","开发工具","基础设施"];
const chips=document.getElementById("chips");
categories.forEach((c,i)=>{
  const b=document.createElement("button");b.className="chip"+(i===0?" active":"");b.textContent=c;
  b.onclick=()=>{category=c;[...chips.children].forEach(x=>x.classList.toggle("active",x===b));render();};
  chips.appendChild(b);
});

function detailUrl(p){return "./detail.html?id="+encodeURIComponent(p.id)+(selectedDate?"&date="+selectedDate:"");}
function noteUrl(p){return "./notes.html?id="+encodeURIComponent(p.id);}
function parseStars(v){if(!v)return 0;const m=String(v).replace(/,/g,"").match(/([+-]?\d+(?:\.\d+)?)(k)?/i);if(!m)return 0;return Number(m[1])*(m[2]?1000:1);}
function fmtDate(s){if(!s||s==="历史项目")return "更早项目";const d=new Date(s+"T00:00:00");return isNaN(d)?s:(d.getMonth()+1)+"月"+d.getDate()+"日";}
function daysAgo(dateStr){const d=new Date(dateStr+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);return Math.floor((n-d)/86400000);}

async function buildAppearance(){
  for(const x of dates)dateSet.add(x.date);
  // 近1个月一定加载；更早日期若项目缺少 last_seen/first_seen，也按需补全
  const need=dates.filter(x=>daysAgo(x.date)>=0&&daysAgo(x.date)<31);
  await Promise.all(need.map(async x=>{
    try{
      const data=await fetch("./daily/"+x.date+".json?v="+Date.now()).then(r=>r.json());
      for(const p of (data.projects||[])){
        appearance[p.id]=appearance[p.id]||[];appearance[p.id].push(x.date);
        if(!firstSeen[p.id]||x.date<firstSeen[p.id])firstSeen[p.id]=x.date;
        if(!lastSeen[p.id]||x.date>lastSeen[p.id]){lastSeen[p.id]=x.date;latestDaily[p.id]=p;}
      }
    }catch(e){}
  }));
  for(const p of master){
    if(p.first_seen&&!firstSeen[p.id])firstSeen[p.id]=p.first_seen;
    if(p.last_seen&&!lastSeen[p.id])lastSeen[p.id]=p.last_seen;
    if(!lastSeen[p.id]&&p.latest_analysis_date)lastSeen[p.id]=p.latest_analysis_date;
    if(!firstSeen[p.id]&&p.first_seen)firstSeen[p.id]=p.first_seen;
  }
}
const NOTES_KEY_STORAGE="github-opportunity-notes-key";
function storedPrivateKey(){
  return localStorage.getItem(NOTES_KEY_STORAGE)||sessionStorage.getItem(NOTES_KEY_STORAGE)||"";
}
function rememberPrivateKey(k){
  if(!k)return;
  localStorage.setItem(NOTES_KEY_STORAGE,k);
  sessionStorage.removeItem(NOTES_KEY_STORAGE);
}
function forgetPrivateKey(){
  localStorage.removeItem(NOTES_KEY_STORAGE);
  sessionStorage.removeItem(NOTES_KEY_STORAGE);
}
function getPrivateKey(){
  let k=storedPrivateKey();
  if(k)return k;
  k=prompt("请输入 NOTES_KEY\n\n验证成功后会记住这台设备；除非你手动锁定、清除浏览器数据或更换浏览器，否则不用再次输入。")||"";
  if(k)rememberPrivateKey(k);
  return k;
}
function addPrivateChips(){
  if(document.getElementById("privateChipNotes"))return;
  const defs=[["有笔记","privateChipNotes"],["已评分","privateChipRated"]];
  defs.forEach((it,idx)=>{
    const b=document.createElement("button");
    b.className="chip";b.id=it[1];b.textContent=it[0];
    b.onclick=()=>{category=it[0];[...chips.children].forEach(x=>x.classList.toggle("active",x===b));render();};
    chips.insertBefore(b,chips.children[idx+1]||null);
  });
}
async function unlockPrivate(){
  if(!NOTES_API)return;
  const key=getPrivateKey();if(!key)return;
  try{
    const r=await fetch(NOTES_API+"/notes",{headers:{"X-Notes-Key":key}});
    if(r.status===401){forgetPrivateKey();alert("NOTES_KEY 不正确");return;}
    if(!r.ok)throw new Error("HTTP "+r.status);
    const out=await r.json();
    privateNotes=out.notes||{};privateUnlocked=true;
    for(const p of master){
      const n=privateNotes[p.id];
      if(n)Object.assign(p,{rating:n.rating,status:n.status,has_notes:n.has_notes});
      else Object.assign(p,{rating:null,status:"👀 观察",has_notes:false});
    }
    addPrivateChips();
    document.getElementById("ratingSelect").style.display="";
    document.getElementById("statusSelect").style.display="";
    rememberPrivateKey(key);
    const ub=document.getElementById("unlockBtn");
    ub.textContent="🔓 私人数据已解锁 · 点此锁定";
    ub.title="此设备已记住 NOTES_KEY；点击可清除本机密钥并锁定私人数据";
    render();
  }catch(e){alert("读取私人数据失败："+e.message);}
}
function lockPrivate(){
  forgetPrivateKey();
  privateUnlocked=false;privateNotes={};
  for(const p of master){delete p.rating;delete p.status;delete p.has_notes;}
  document.getElementById("ratingSelect").style.display="none";
  document.getElementById("statusSelect").style.display="none";
  document.getElementById("privateChipNotes")?.remove();
  document.getElementById("privateChipRated")?.remove();
  if(category==="有笔记"||category==="已评分")category="全部";
  ratingFilter="all";statusFilter="all";
  document.getElementById("ratingSelect").value="all";
  document.getElementById("statusSelect").value="all";
  const ub=document.getElementById("unlockBtn");
  ub.textContent="🔒 解锁我的数据";ub.title="";
  [...chips.children].forEach(x=>x.classList.toggle("active",x.textContent==="全部"));
  render();saveCatalogState();
}
document.getElementById("unlockBtn").onclick=()=>{
  if(privateUnlocked){
    if(confirm("锁定私人数据并清除这台设备保存的 NOTES_KEY？"))lockPrivate();
  }else unlockPrivate();
};
async function syncSummary(){
  const key=storedPrivateKey();
  if(key)await unlockPrivate();
}
function sortList(list){
  return list.sort((a,b)=>{
    if(sortMode==="rating")return (b.rating||0)-(a.rating||0)||String(lastSeen[b.id]||"").localeCompare(String(lastSeen[a.id]||""));
    if(sortMode==="stars")return parseStars((latestDaily[b.id]||b).stars_today)-parseStars((latestDaily[a.id]||a).stars_today);
    if(sortMode==="first")return String(firstSeen[b.id]||"").localeCompare(String(firstSeen[a.id]||""));
    const ad=selectedDate||lastSeen[a.id]||a.latest_analysis_date||"",bd=selectedDate||lastSeen[b.id]||b.latest_analysis_date||"";
    return String(bd).localeCompare(String(ad))||parseStars((latestDaily[b.id]||b).stars_today)-parseStars((latestDaily[a.id]||a).stars_today);
  });
}
function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  let list=shown.filter(p=>{
    const hay=[p.name,p.description,(p.tags||[]).join(" "),p.target_users,p.problem,p.why_hot,p.why,p.difference,p.business,p.judgment,p.full_analysis].join(" ").toLowerCase();
    const cat=category==="全部"||(category==="有笔记"?privateUnlocked&&!!p.has_notes:category==="已评分"?privateUnlocked&&!!p.rating:(p.tags||[]).includes(category));
    const rate=ratingFilter==="all"||(privateUnlocked&&(ratingFilter==="rated"?!!p.rating:ratingFilter==="unrated"?!p.rating:String(p.rating)===ratingFilter));
    const stat=statusFilter==="all"||(privateUnlocked&&p.status===statusFilter);
    const last=lastSeen[p.id]||p.latest_analysis_date||"";
    const time=timeFilter==="all"||(!selectedDate&&last&&daysAgo(last)>=0&&daysAgo(last)<Number(timeFilter));
    return (!q||hay.includes(q))&&cat&&rate&&stat&&time;
  });
  list=sortList(list);
  document.getElementById("count").textContent=list.length+" 个项目";
  document.getElementById("empty").hidden=list.length>0;
  const grid=document.getElementById("grid");grid.innerHTML="";
  let group=null;
  for(const p of list){
    const groupDate=selectedDate||lastSeen[p.id]||p.latest_analysis_date||"历史项目";
    if(sortMode==="recent" && groupDate!==group){
      group=groupDate;
      const sep=document.createElement("div");sep.className="daySep";
      const age=groupDate!=="历史项目"?daysAgo(groupDate):null;
      const rel=age===0?"今天":age===1?"昨天":age>1&&age<31?"距今 "+age+" 天":"";
      sep.innerHTML="<span>"+fmtDate(groupDate)+"</span>"+(rel?"<small>"+rel+"</small>":"");
      grid.appendChild(sep);
    }
    const dailyData=selectedDate?p:(latestDaily[p.id]||p);
    const el=document.createElement("article");el.className="card";
    const tags=(p.tags||[]).map(t=>'<span class="tag '+(t==="重点"?"hot":"")+'">'+t+'</span>').join("");
    const rank=dailyData.rank?"#"+dailyData.rank+"　":"";
    const daily=dailyData.stars_today?'<div class="daily">'+rank+dailyData.stars_today+'　总 Star '+(dailyData.total_stars||p.total_stars||"—")+'　'+(dailyData.language||p.language||"")+'</div>':"";
    const rating=privateUnlocked&&p.rating?'<span class="tag hot">我的评分 '+"★".repeat(p.rating)+"☆".repeat(5-p.rating)+'</span>':"";
    const note=privateUnlocked&&p.has_notes?'<span class="tag">已做笔记</span>':"";
    el.innerHTML='<div class="name">'+p.name+'</div>'+daily+'<div class="desc">'+(p.description||"")+'</div><div class="tags">'+rating+note+tags+'</div><div class="actions"><a class="btn detail" href="'+detailUrl(p)+'">详细分析</a><a class="btn notes '+(privateUnlocked&&p.has_notes?"has":"")+'" href="'+noteUrl(p)+'">'+(privateUnlocked&&p.has_notes?"笔记 ✓":"笔记")+'</a><a class="btn" href="'+p.url+'" target="_blank" rel="noopener">GitHub</a></div>';
    el.onclick=e=>{if(e.target.closest("a,button,input,select,textarea"))return;saveCatalogState();location.href=detailUrl(p);};
    el.querySelectorAll('a[href*="detail.html"],a[href*="notes.html"]').forEach(a=>a.addEventListener("click",saveCatalogState));
    grid.appendChild(el);
  }
}
async function loadExactDate(date){
  selectedDate=date;timeFilter="all";document.getElementById("timeSelect").value="all";
  if(!date){shown=master;document.getElementById("modeLabel").textContent="全部历史项目";render();return;}
  if(!dateSet.has(date)){shown=[];document.getElementById("modeLabel").textContent=fmtDate(date)+" 暂无归档";render();return;}
  const data=await fetch("./daily/"+date+".json?v="+Date.now()).then(r=>r.json());
  const by=Object.fromEntries(master.map(p=>[p.id,p]));
  shown=(data.projects||[]).map(p=>({...p,tags:by[p.id]?.tags||[],has_notes:by[p.id]?.has_notes||false,rating:by[p.id]?.rating||null,status:by[p.id]?.status||"👀 观察"}));
  document.getElementById("modeLabel").textContent=fmtDate(date)+" 当日 Top 10";render();
}

document.getElementById("search").oninput=()=>{render();saveCatalogState();};
document.getElementById("ratingSelect").onchange=e=>{ratingFilter=e.target.value;render();saveCatalogState();};
document.getElementById("statusSelect").onchange=e=>{statusFilter=e.target.value;render();saveCatalogState();};
document.getElementById("sortSelect").onchange=e=>{sortMode=e.target.value;render();saveCatalogState();};
document.getElementById("datePicker").onchange=async e=>{await loadExactDate(e.target.value);saveCatalogState();};
document.getElementById("timeSelect").onchange=e=>{
  timeFilter=e.target.value;selectedDate="";document.getElementById("datePicker").value="";shown=master;
  document.getElementById("modeLabel").textContent=timeFilter==="all"?"全部历史项目":timeFilter==="30"?"近1个月":"近"+timeFilter+"天";render();saveCatalogState();
};
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href*="notes.html"]');
  if(!a)return;
  sessionStorage.setItem("notes-return-url",location.href);
  sessionStorage.setItem("notes-return-scroll",String(window.scrollY));
});
function restoreNotesPosition(){
  const y=sessionStorage.getItem("notes-return-scroll");
  if(y===null)return;
  sessionStorage.removeItem("notes-return-scroll");
  setTimeout(()=>window.scrollTo(0,Number(y)||0),80);
}
let scrollSaveTimer=null;
window.addEventListener("scroll",()=>{
  document.getElementById("toTop").style.display=scrollY>600?"block":"none";
  clearTimeout(scrollSaveTimer);scrollSaveTimer=setTimeout(saveCatalogState,120);
},{passive:true});
window.addEventListener("pagehide",saveCatalogState);
document.getElementById("toTop").onclick=()=>window.scrollTo({top:0,behavior:"smooth"});

Promise.all([fetch("./projects.json?v="+Date.now()).then(r=>r.json()),fetch("./daily/index.json?v="+Date.now()).then(r=>r.json())]).then(async([p,d])=>{
  master=p.projects||[];shown=master;dates=d.dates||[];
  pendingRestore=readCatalogState();restoreCatalogControls(pendingRestore);
  const max=dates[0]?.date||new Date().toISOString().slice(0,10);document.getElementById("datePicker").max=max;
  await buildAppearance();
  if(selectedDate&&dateSet.has(selectedDate)){
    const data=await fetch("./daily/"+selectedDate+".json?v="+Date.now()).then(r=>r.json()).catch(()=>null);
    if(data){
      const by=Object.fromEntries(master.map(p=>[p.id,p]));
      shown=(data.projects||[]).map(p=>({...p,tags:by[p.id]?.tags||[],has_notes:by[p.id]?.has_notes||false,rating:by[p.id]?.rating||null,status:by[p.id]?.status||"👀 观察"}));
      document.getElementById("modeLabel").textContent=fmtDate(selectedDate)+" 当日 Top 10";
    }
  }else if(timeFilter!=="all"){
    document.getElementById("modeLabel").textContent=timeFilter==="30"?"近1个月":"近"+timeFilter+"天";
  }
  render();restoreCatalogScroll(pendingRestore);restoreNotesPosition();syncSummary();
}).catch(()=>{document.getElementById("count").textContent="加载失败";});
</script>
</body></html>
