<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>项目笔记</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#15171c;--muted:#667085;--line:#e5e8ee;--blue:#2563eb;--shadow:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}.wrap{max-width:760px;margin:auto;padding:18px 14px 70px}.back{display:inline-block;margin-bottom:14px;color:#374151;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}h1{margin:0 0 8px;font-size:27px}.desc{color:#475467;line-height:1.7}.label{font-weight:700;margin:18px 0 8px}.stars{display:flex;gap:7px}.star{border:0;background:transparent;font-size:31px;color:#c9ced8;padding:0;cursor:pointer}.star.on{color:#f59e0b}select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:#fff}textarea{min-height:115px;resize:vertical}.btn{width:100%;border:0;background:#111827;color:#fff;border-radius:11px;padding:12px;font-size:15px;margin-top:14px;cursor:pointer}.msg{font-size:13px;color:var(--muted);margin-top:9px}.sync{display:inline-block;background:#e9fbf4;color:#087f5b;border-radius:999px;padding:5px 9px;font-size:12px;margin-top:7px}@media(max-width:700px){.wrap{padding:12px}.card{padding:16px}h1{font-size:23px}}
</style></head><body><main class="wrap"><a class="back" href="./">← 返回项目目录</a><section class="card">
<h1 id="name">加载中…</h1><div id="desc" class="desc"></div><div id="sync" class="sync">私人云端同步</div>
<div class="label">我的评分</div><div id="stars" class="stars"></div>
<div class="label">当前状态</div><select id="status"><option>👀 观察</option><option>💡 有启发</option><option>🧪 想验证</option><option>🚀 准备做</option><option>✅ 已研究</option><option>⏸ 暂缓</option></select>
<div class="label">我的备注</div><textarea id="note" placeholder="记录这个项目给你的启发、可借鉴点、风险、想法……"></textarea>
<div class="label">下一步行动</div><textarea id="next" placeholder="例如：让 Codex 跑一下、研究国内竞品、做 Demo、过几天再看 Star 增速……"></textarea>
<button id="save" class="btn">保存到私人云端</button><div id="msg" class="msg"></div>
</section></main><script src="./config.js"></script><script>
const id=new URLSearchParams(location.search).get("id"),API=(window.NOTES_API||"").replace(/\/$/,"");let project=null,rating=null,key=sessionStorage.getItem("github-opportunity-notes-key")||"";
function ensureKey(){if(key)return key;const v=prompt("请输入 NOTES_KEY")||"";if(v){key=v;sessionStorage.setItem("github-opportunity-notes-key",v);}return key;}
async function api(path,opt={}){const k=ensureKey();if(!k)throw new Error("未输入访问密钥");const r=await fetch(API+path,{...opt,headers:{"Content-Type":"application/json","X-Notes-Key":k,...(opt.headers||{})}});if(r.status===401){sessionStorage.removeItem("github-opportunity-notes-key");key="";throw new Error("访问密钥不正确");}if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
function draw(){const box=document.getElementById("stars");box.innerHTML="";for(let i=1;i<=5;i++){const b=document.createElement("button");b.className="star"+((rating||0)>=i?" on":"");b.textContent="★";b.onclick=()=>{rating=i;draw();};box.appendChild(b);}}
fetch("./projects.json?v="+Date.now()).then(r=>r.json()).then(async d=>{project=(d.projects||[]).find(x=>x.id===id);if(!project)throw 0;document.title=project.name+"｜笔记";document.getElementById("name").textContent=project.name;document.getElementById("desc").textContent=project.description||"";draw();document.getElementById("msg").textContent="正在读取私人笔记…";try{const n=await api("/notes/"+encodeURIComponent(project.id));rating=n.rating;document.getElementById("status").value=n.status||"👀 观察";document.getElementById("note").value=n.note||"";document.getElementById("next").value=n.next_action||"";draw();document.getElementById("msg").textContent="私人笔记已同步。";}catch(e){document.getElementById("msg").textContent="读取失败："+e.message;}})
.catch(()=>document.getElementById("name").textContent="项目加载失败");
document.getElementById("save").onclick=async()=>{if(!project)return;const msg=document.getElementById("msg");msg.textContent="保存中…";try{const out=await api("/notes/"+encodeURIComponent(project.id),{method:"POST",body:JSON.stringify({name:project.name,project_url:project.url,description:project.description,rating,status:document.getElementById("status").value,note:document.getElementById("note").value.trim(),next_action:document.getElementById("next").value.trim()})});rating=out.rating;draw();msg.textContent="已保存到私人云端，手机和电脑会同步。";}catch(e){msg.textContent="保存失败："+e.message;}};
</script></body></html>
